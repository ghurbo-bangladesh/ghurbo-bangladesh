<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>লগইন | ঘুরবো বাংলাদেশ</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f7ee, #f4f7fb);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      box-sizing: border-box;
    }
    .login-card {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 26px;
      border-radius: 20px;
      box-shadow: 0 12px 40px #12331c18;
      box-sizing: border-box;
    }
    .login-card h1 {
      color: #176b43;
      text-align: center;
      margin-top: 0;
    }
    .login-card p {
      text-align: center;
      color: #667085;
    }
    .login-card label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }
    .login-card input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border: 1px solid #d5ded8;
      border-radius: 10px;
      font-size: 16px;
    }
    .login-card button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      margin-top: 18px;
      background: #176b43;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .switch {
      color: #176b43;
      cursor: pointer;
      font-weight: bold;
    }
    #message {
      overflow-wrap: anywhere;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>ঘুরবো বাংলাদেশ 🇧🇩</h1>
    <p id="subtitle">আপনার অ্যাকাউন্টে লগইন করুন</p>

    <form id="authForm">
      <div id="nameArea" hidden>
        <label for="fullName">আপনার নাম</label>
        <input id="fullName" type="text" autocomplete="name">
      </div>

      <label for="email">ইমেইল</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">পাসওয়ার্ড</label>
      <input id="password" type="password"
        autocomplete="current-password" minlength="6" required>

      <button id="submitBtn" type="submit">লগইন করুন</button>
    </form>

    <p id="switchText">
      নতুন ব্যবহারকারী?
      <span class="switch" id="switchMode">রেজিস্ট্রেশন করুন</span>
    </p>
    <p id="message" role="status"></p>
    <p><a href="./index.html">হোমপেজে ফিরে যান</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://hbllzgylzemdszsbetkl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhibGx6Z3lsemVtZHN6c2JldGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTA5MjksImV4cCI6MjEwNjgyNjkyOX0.Qsx2bG000YHhzoyObbXZBxE8wPrrtjvonnplqGyyX5w";

    const sb = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    let isSignup = false;

    const form = document.getElementById("authForm");
    const nameArea = document.getElementById("nameArea");
    const fullName = document.getElementById("fullName");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const switchMode = document.getElementById("switchMode");
    const switchText = document.getElementById("switchText");
    const subtitle = document.getElementById("subtitle");
    const message = document.getElementById("message");

    switchMode.addEventListener("click", () => {
      isSignup = !isSignup;
      nameArea.hidden = !isSignup;
      fullName.required = isSignup;
      password.autocomplete = isSignup
        ? "new-password" : "current-password";
      submitBtn.textContent = isSignup
        ? "অ্যাকাউন্ট তৈরি করুন" : "লগইন করুন";
      subtitle.textContent = isSignup
        ? "নতুন অ্যাকাউন্ট তৈরি করুন"
        : "আপনার অ্যাকাউন্টে লগইন করুন";
      switchText.innerHTML = isSignup
        ? 'আগে অ্যাকাউন্ট আছে? <span class="switch" id="switchMode">লগইন করুন</span>'
        : 'নতুন ব্যবহারকারী? <span class="switch" id="switchMode">রেজিস্ট্রেশন করুন</span>';
      message.textContent = "";

      document.getElementById("switchMode").addEventListener(
        "click", () => {
          isSignup = !isSignup;
          nameArea.hidden = !isSignup;
          fullName.required = isSignup;
          submitBtn.textContent = isSignup
            ? "অ্যাকাউন্ট তৈরি করুন" : "লগইন করুন";
          subtitle.textContent = isSignup
            ? "নতুন অ্যাকাউন্ট তৈরি করুন"
            : "আপনার অ্যাকাউন্টে লগইন করুন";
          switchText.innerHTML = isSignup
            ? 'আগে অ্যাকাউন্ট আছে? <span class="switch" id="switchMode">লগইন করুন</span>'
            : 'নতুন ব্যবহারকারী? <span class="switch" id="switchMode">রেজিস্ট্রেশন করুন</span>';
          message.textContent = "";
          attachSwitch();
        }, { once: true }
      );
    });

    function attachSwitch() {
      const el = document.getElementById("switchMode");
      if (el) el.addEventListener("click", () => {
        isSignup = !isSignup;
        nameArea.hidden = !isSignup;
        fullName.required = isSignup;
        submitBtn.textContent = isSignup
          ? "অ্যাকাউন্ট তৈরি করুন" : "লগইন করুন";
        subtitle.textContent = isSignup
          ? "নতুন অ্যাকাউন্ট তৈরি করুন"
          : "আপনার অ্যাকাউন্টে লগইন করুন";
        switchText.innerHTML = isSignup
          ? 'আগে অ্যাকাউন্ট আছে? <span class="switch" id="switchMode">লগইন করুন</span>'
          : 'নতুন ব্যবহারকারী? <span class="switch" id="switchMode">রেজিস্ট্রেশন করুন</span>';
        message.textContent = "";
        attachSwitch();
      }, { once: true });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "একটু অপেক্ষা করুন...";
      submitBtn.disabled = true;

      try {
        if (SUPABASE_ANON_KEY.includes("এখানে আপনার")) {
          throw new Error("Supabase anon public key বসানো হয়নি।");
        }

        let result;

        if (isSignup) {
          result = await sb.auth.signUp({
            email: email.value.trim(),
            password: password.value,
            options: {
              data: { full_name: fullName.value.trim() }
            }
          });
        } else {
          result = await sb.auth.signInWithPassword({
            email: email.value.trim(),
            password: password.value
          });
        }

        if (result.error) throw result.error;

        if (isSignup && !result.data.session) {
          message.textContent =
            "অ্যাকাউন্ট তৈরি হয়েছে। ইমেইলে ভেরিফিকেশন লিংক এলে সেটিতে চাপ দিন, তারপর লগইন করুন।";
          return;
        }

        window.location.href = "./dashboard.html";
      } catch (error) {
        message.textContent = "সমস্যা: " + error.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
