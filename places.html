<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>বিভাগ ও দর্শনীয় স্থান | ঘুরবো বাংলাদেশ</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #20352a;
      background: #f3f7f5;
    }
    header {
      background: #125b3b;
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    header a { color: white; text-decoration: none; }
    main { max-width: 1100px; margin: auto; padding: 20px 14px; }
    .intro {
      padding: 25px 20px;
      color: white;
      border-radius: 20px;
      background: linear-gradient(120deg, #125b3b, #2b9466);
      margin-bottom: 22px;
    }
    .intro h1 { margin-top: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .tile {
      background: white;
      padding: 18px;
      border: 1px solid #e2ebe5;
      border-radius: 15px;
      text-align: left;
      cursor: pointer;
      color: #20352a;
      font-size: 16px;
      box-shadow: 0 5px 18px #12331c0b;
    }
    .tile strong { display: block; margin-bottom: 6px; color: #176b43; }
    .tile:active { transform: scale(.98); }
    .back {
      border: 0;
      background: #176b43;
      color: white;
      border-radius: 9px;
      padding: 10px 14px;
      margin-bottom: 15px;
      cursor: pointer;
    }
    .place-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid #e2ebe5;
    }
    .place-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
    .place-info { padding: 15px; }
    .place-info h3 { margin: 0 0 8px; }
    .points { color: #176b43; font-weight: bold; }
    .visit-btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 14px;
      background: #176b43;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .visit-btn:disabled { background: #8a9b91; }
    #message { overflow-wrap: anywhere; }
    .hidden { display: none !important; }
    @media (min-width: 650px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      #placeGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <strong>🇧🇩 ঘুরবো বাংলাদেশ</strong>
    <nav>
      <a href="./index.html">হোম</a>
      &nbsp; | &nbsp;
      <a href="./dashboard.html">আমার ড্যাশবোর্ড</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h1>বাংলাদেশ ঘুরে দেখুন 🇧🇩</h1>
      <p>বিভাগ বেছে নিন, জেলা নির্বাচন করুন, তারপর দর্শনীয় স্থান দেখুন।</p>
    </section>

    <button id="backBtn" class="back hidden">← পেছনে যান</button>
    <h2 id="heading">বিভাগ নির্বাচন করুন</h2>
    <p id="subheading">আপনার পছন্দের বিভাগে চাপ দিন।</p>
    <p id="message" role="status"></p>
    <div id="regionGrid" class="grid"></div>
    <div id="placeGrid" class="grid hidden"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://hbllzgylzemdszsbetkl.supabase.co";
    const SUPABASE_ANON_KEY =
      "এখানে login.html ফাইলে ব্যবহার করা একই anon public key বসান";

    const sb = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_ANON_KEY
    );

    const divisions = [
      { name: "ঢাকা", districts: ["ঢাকা","গাজীপুর","গোপালগঞ্জ","কিশোরগঞ্জ","মাদারীপুর","মানিকগঞ্জ","মুন্সিগঞ্জ","নারায়ণগঞ্জ","নরসিংদী","রাজবাড়ী","শরীয়তপুর","টাঙ্গাইল","ফরিদপুর","নেত্রকোনা","ময়মনসিংহ","জামালপুর","শেরপুর"] },
      { name: "চট্টগ্রাম", districts: ["চট্টগ্রাম","কক্সবাজার","কুমিল্লা","ব্রাহ্মণবাড়িয়া","চাঁদপুর","ফেনী","লক্ষ্মীপুর","নোয়াখালী","খাগড়াছড়ি","রাঙামাটি","বান্দরবান"] },
      { name: "রাজশাহী", districts: ["রাজশাহী","বগুড়া","জয়পুরহাট","নওগাঁ","নাটোর","চাঁপাইনবাবগঞ্জ","পাবনা","সিরাজগঞ্জ"] },
      { name: "খুলনা", districts: ["খুলনা","বাগেরহাট","চুয়াডাঙ্গা","যশোর","ঝিনাইদহ","কুষ্টিয়া","মাগুরা","মেহেরপুর","নড়াইল","সাতক্ষীরা"] },
      { name: "বরিশাল", districts: ["বরিশাল","বরগুনা","ভোলা","ঝালকাঠি","পটুয়াখালী","পিরোজপুর"] },
      { name: "সিলেট", districts: ["সিলেট","মৌলভীবাজার","হবিগঞ্জ","সুনামগঞ্জ"] },
      { name: "রংপুর", districts: ["রংপুর","দিনাজপুর","গাইবান্ধা","কুড়িগ্রাম","লালমনিরহাট","নীলফামারী","পঞ্চগড়","ঠাকুরগাঁও"] },
      { name: "ময়মনসিংহ", districts: ["ময়মনসিংহ","জামালপুর","নেত্রকোনা","শেরপুর"] }
    ];

    const samplePlaces = {
      "কক্সবাজার": [
        { name: "কক্সবাজার সমুদ্রসৈকত", points: 2, image: "https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=80" },
        { name: "হিমছড়ি", points: 1.5, image: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" },
        { name: "ইনানী সমুদ্রসৈকত", points: 1, image: "https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=900&q=80" }
      ],
      "সিলেট": [
        { name: "জাফলং", points: 2, image: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" },
        { name: "রাতারগুল জলাবন", points: 1.5, image: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=900&q=80" },
        { name: "সাদাপাথর", points: 1, image: "https://images.unsplash.com/photo-1433086966358-54859d0ed716?auto=format&fit=crop&w=900&q=80" }
      ],
      "চট্টগ্রাম": [
        { name: "পতেঙ্গা সমুদ্রসৈকত", points: 1.5, image: "https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=80" },
        { name: "ফয়েজ লেক", points: 1, image: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" }
      ],
      "রাঙামাটি": [
        { name: "কাপ্তাই হ্রদ", points: 2, image: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" }
      ],
      "রাজশাহী": [
        { name: "পদ্মা নদীর পাড়", points: 1, image: "https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=80" }
      ],
      "ঢাকা": [
        { name: "লালবাগ কেল্লা", points: 1.5, image: "https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=900&q=80" },
        { name: "আহসান মঞ্জিল", points: 1, image: "https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=900&q=80" }
      ]
    };

    const regionGrid = document.getElementById("regionGrid");
    const placeGrid = document.getElementById("placeGrid");
    const heading = document.getElementById("heading");
    const subheading = document.getElementById("subheading");
    const backBtn = document.getElementById("backBtn");
    const message = document.getElementById("message");

    let level = "division";
    let currentDivision = null;
    let currentDistrict = null;
    let currentUser = null;
    let visitedNames = new Set();

    async function init() {
      if (SUPABASE_ANON_KEY.includes("এখানে login.html")) {
        message.textContent =
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhibGx6Z3lsemVtZHN6c2JldGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTA5MjksImV4cCI6MjEwNjgyNjkyOX0.Qsx2bG000YHhzoyObbXZBxE8wPrrtjvonnplqGyyX5w";
      } else {
        const { data } = await sb.auth.getUser();
        currentUser = data?.user || null;
        if (currentUser) {
          const { data: visits } = await sb.from("place_visits")
            .select("place_name").eq("user_id", currentUser.id);
          (visits || []).forEach(v => visitedNames.add(v.place_name));
        }
      }
      showDivisions();
    }

    function makeTile(title, detail, action) {
      const button = document.createElement("button");
      button.className = "tile";
      const strong = document.createElement("strong");
      strong.textContent = title;
      const small = document.createElement("span");
      small.textContent = detail;
      button.append(strong, small);
      button.addEventListener("click", action);
      return button;
    }

    function showDivisions() {
      level = "division";
      heading.textContent = "বাংলাদেশের ৮টি বিভাগ";
      subheading.textContent = "যে বিভাগ ঘুরতে চান, সেটিতে চাপ দিন।";
      regionGrid.replaceChildren();
      placeGrid.classList.add("hidden");
      regionGrid.classList.remove("hidden");
      backBtn.classList.add("hidden");

      divisions.forEach(div => {
        regionGrid.appendChild(makeTile(
          "📍 " + div.name + " বিভাগ",
          div.districts.length + "টি জেলা",
          () => showDistricts(div)
        ));
      });
    }

    function showDistricts(div) {
      level = "district";
      currentDivision = div;
      heading.textContent = div.name + " বিভাগের জেলা";
      subheading.textContent = "একটি জেলা নির্বাচন করুন।";
      regionGrid.replaceChildren();
      div.districts.forEach(district => {
        regionGrid.appendChild(makeTile(
          "🏞️ " + district,
          "দর্শনীয় স্থান দেখতে চাপ দিন",
          () => showPlaces(district)
        ));
      });
      backBtn.classList.remove("hidden");
    }

    function showPlaces(district) {
      level = "place";
      currentDistrict = district;
      heading.textContent = district + " জেলার দর্শনীয় স্থান";
      subheading.textContent =
        "স্থান নির্বাচন করে ভ্রমণ সম্পন্ন হিসেবে জমা দিন।";
      regionGrid.classList.add("hidden");
      placeGrid.classList.remove("hidden");
      placeGrid.replaceChildren();

      const places = samplePlaces[district] || [];
      if (places.length === 0) {
        const empty = document.createElement("p");
        empty.textContent =
          "এই জেলার স্থানগুলোর তালিকা এখনো যোগ করা হয়নি। পরবর্তী ধাপে আমরা আরও স্থান যোগ করব।";
        placeGrid.appendChild(empty);
      }

      places.forEach(place => {
        const card = document.createElement("article");
        card.className = "place-card";

        const img = document.createElement("img");
        img.src = place.image;
        img.alt = place.name;
        img.loading = "lazy";

        const info = document.createElement("div");
        info.className = "place-info";

        const title = document.createElement("h3");
        title.textContent = place.name;

        const score = document.createElement("p");
        score.className = "points";
        score.textContent = place.points + " পয়েন্ট";

        const btn = document.createElement("button");
        btn.className = "visit-btn";
        btn.textContent = visitedNames.has(place.name)
          ? "ইতিমধ্যে জমা হয়েছে" : "ভ্রমণ সম্পন্ন জমা দিন";
        btn.disabled = visitedNames.has(place.name);

        btn.addEventListener("click", async () => {
          if (!currentUser) {
            window.location.href = "./login.html";
            return;
          }
          btn.disabled = true;
          btn.textContent = "জমা হচ্ছে...";

          const { error } = await sb.from("place_visits").insert({
            user_id: currentUser.id,
            place_name: place.name,
            points: place.points
          });

          if (error) {
            message.textContent = error.code === "23505"
              ? "এই স্থান থেকে আগে পয়েন্ট জমা দিয়েছেন।"
              : "জমা হয়নি: " + error.message;
            btn.disabled = error.code === "23505";
            btn.textContent = error.code === "23505"
              ? "ইতিমধ্যে জমা হয়েছে" : "আবার চেষ্টা করুন";
            return;
          }

          visitedNames.add(place.name);
          btn.textContent = "পয়েন্ট জমা হয়েছে ✓";
          message.textContent =
            "+" + place.points + " পয়েন্ট আপনার অ্যাকাউন্টে জমা হয়েছে।";
        });

        info.append(title, score, btn);
        card.append(img, info);
        placeGrid.appendChild(card);
      });
      backBtn.classList.remove("hidden");
    }

    backBtn.addEventListener("click", () => {
      message.textContent = "";
      if (level === "place") {
        showDistricts(currentDivision);
      } else if (level === "district") {
        showDivisions();
      }
    });

    init();
  </script>
</body>
</html>
