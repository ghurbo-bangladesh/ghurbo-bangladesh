<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>বিভাগ ও জেলা | ঘুরবো বাংলাদেশ</title>
  <link rel="stylesheet" href="./style.css?v=3">
  <style>
    .browse-head {
      padding: 28px;
      background: #e2f2e5;
      border-radius: 20px;
      margin-bottom: 22px;
    }
    .browse-head h1 {
      color: #104b34;
      margin: 0 0 8px;
    }
    .district-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .district-button {
      background: white;
      border: 1px solid #e0eae2;
      border-radius: 12px;
      padding: 15px 10px;
      color: #176344;
      font-weight: 700;
      text-align: left;
    }
    .district-button:hover {
      background: #eaf5ed;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #176344;
      font-weight: 700;
    }
    @media (max-width: 600px) {
      .district-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./index.html">🇧🇩 ঘুরবো বাংলাদেশ</a>
  <nav><a href="./index.html">হোমে ফিরে যান</a></nav>
</header>

<main>
  <a class="back-link" href="./index.html#divisions">← সব বিভাগ</a>

  <section class="browse-head">
    <p class="eyebrow">Explore Bangladesh</p>
    <h1 id="divisionTitle">বাংলাদেশের জেলা</h1>
    <p>আপনার পছন্দের জেলা নির্বাচন করুন।</p>
  </section>

  <section class="section">
    <div class="section-head">
      <h2 id="districtHeading">জেলার তালিকা</h2>
      <span class="pill" id="districtCount"></span>
    </div>
    <div id="districtGrid" class="district-grid"></div>
    <p id="message" class="notice hidden"></p>
  </section>
</main>

<footer>© 2026 ঘুরবো বাংলাদেশ 🇧🇩</footer>

<script>
const divisions = {
  barishal: {
    name: "বরিশাল বিভাগ",
    districts: [
      "বরিশাল", "বরগুনা", "ভোলা", "ঝালকাঠি",
      "পটুয়াখালী", "পিরোজপুর"
    ]
  },
  chattogram: {
    name: "চট্টগ্রাম বিভাগ",
    districts: [
      "চট্টগ্রাম", "কক্সবাজার", "কুমিল্লা", "ব্রাহ্মণবাড়িয়া",
      "চাঁদপুর", "ফেনী", "লক্ষ্মীপুর", "নোয়াখালী",
      "খাগড়াছড়ি", "রাঙ্গামাটি", "বান্দরবান"
    ]
  },
  dhaka: {
    name: "ঢাকা বিভাগ",
    districts: [
      "ঢাকা", "গাজীপুর", "গোপালগঞ্জ", "কিশোরগঞ্জ",
      "মাদারীপুর", "মানিকগঞ্জ", "মুন্সীগঞ্জ", "নারায়ণগঞ্জ",
      "নরসিংদী", "রাজবাড়ী", "ফরিদপুর", "শরীয়তপুর",
      "টাঙ্গাইল"
    ]
  },
  khulna: {
    name: "খুলনা বিভাগ",
    districts: [
      "খুলনা", "বাগেরহাট", "চুয়াডাঙ্গা", "যশোর",
      "ঝিনাইদহ", "কুষ্টিয়া", "মাগুরা", "মেহেরপুর",
      "নড়াইল", "সাতক্ষীরা"
    ]
  },
  mymensingh: {
    name: "ময়মনসিংহ বিভাগ",
    districts: [
      "ময়মনসিংহ", "জামালপুর", "নেত্রকোণা", "শেরপুর"
    ]
  },
  rajshahi: {
    name: "রাজশাহী বিভাগ",
    districts: [
      "রাজশাহী", "বগুড়া", "জয়পুরহাট", "নওগাঁ",
      "নাটোর", "চাঁপাইনবাবগঞ্জ", "পাবনা", "সিরাজগঞ্জ"
    ]
  },
  rangpur: {
    name: "রংপুর বিভাগ",
    districts: [
      "রংপুর", "দিনাজপুর", "গাইবান্ধা", "কুড়িগ্রাম",
      "লালমনিরহাট", "নীলফামারী", "পঞ্চগড়", "ঠাকুরগাঁও"
    ]
  },
  sylhet: {
    name: "সিলেট বিভাগ",
    districts: [
      "সিলেট", "মৌলভীবাজার", "হবিগঞ্জ", "সুনামগঞ্জ"
    ]
  }
};

const params = new URLSearchParams(window.location.search);
const divisionKey = params.get("division");
const division = divisions[divisionKey];

const title = document.getElementById("divisionTitle");
const heading = document.getElementById("districtHeading");
const grid = document.getElementById("districtGrid");
const count = document.getElementById("districtCount");
const message = document.getElementById("message");

if (!division) {
  title.textContent = "বিভাগ নির্বাচন করুন";
  heading.textContent = "৮টি বিভাগ";
  count.textContent = "৮ বিভাগ";
  grid.innerHTML = "";

  Object.entries(divisions).forEach(([key, item]) => {
    const link = document.createElement("a");
    link.className = "district-button";
    link.href = "./places.html?division=" + key;
    link.textContent = "📍 " + item.name;
    grid.appendChild(link);
  });
} else {
  title.textContent = division.name;
  heading.textContent = "জেলা নির্বাচন করুন";
  count.textContent = division.districts.length + "টি জেলা";

  division.districts.forEach((district) => {
    const button = document.createElement("button");
    button.className = "district-button";
    button.type = "button";
    button.textContent = "📍 " + district;

    button.addEventListener("click", () => {
      message.textContent =
        district + " জেলার দর্শনীয় স্থানের তালিকা পরের ধাপে যুক্ত করা হবে।";
      message.classList.remove("hidden");
    });

    grid.appendChild(button);
  });
}
</script>
</body>
</html>
