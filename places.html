<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#116149">
<title>বিভাগ ও জেলা | ঘুরবো বাংলাদেশ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5faf7;color:#20372b;font-family:Arial,"Noto Sans Bengali",sans-serif}
header{background:#116149;color:white;padding:18px 12px;text-align:center}
header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;font-size:13px}
main{width:94%;max-width:1000px;margin:22px auto 40px}
h2{text-align:center;color:#116149;font-size:22px}
.subtitle{text-align:center;color:#6d7c72;font-size:13px;margin-bottom:20px}
button{font:inherit;cursor:pointer}
.back{border:0;border-radius:9px;padding:10px 14px;color:#116149;background:#e4f2e9;font-weight:bold;margin-bottom:12px}
.grid{display:grid;gap:10px}
.divisions{grid-template-columns:repeat(2,minmax(0,1fr))}
.districts{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{min-width:0;border:1px solid #dbe9df;border-radius:12px;overflow:hidden;background:white;color:#116149;font-weight:bold;box-shadow:0 3px 10px #173d2509}
.division-card{padding:0;text-align:left}
.photo{height:85px;display:grid;place-items:center;font-size:36px;background:#dcefe3}
.division-name{display:block;padding:10px;font-size:14px}
.district-card{min-height:52px;padding:7px 3px;font-size:13px;overflow-wrap:anywhere}
.card:active,.card.selected{background:#116149;color:white;border-color:#116149}
.places-box{margin-top:22px;padding:16px;background:white;border:1px solid #dbe9df;border-radius:12px;color:#6d7c72;font-size:14px;line-height:1.8}
.place-item{padding:12px 0;border-bottom:1px solid #e5eee8}
.place-item strong{color:#116149}
.hidden{display:none!important}
@media(min-width:700px){.divisions{grid-template-columns:repeat(4,minmax(0,1fr))}.photo{height:130px}.division-name{font-size:16px}.district-card{min-height:60px;font-size:15px}}
</style>
</head>
<body>
<header>
<h1>🏞️ ঘুরবো বাংলাদেশ</h1>
<p>আপনার ভ্রমণ, আপনার অর্জন</p>
</header>
<main>
<button id="backButton" class="back hidden" type="button">← ফিরে যান</button>
<section id="divisionSection">
<h2>🗺️ বাংলাদেশের ৮টি বিভাগ</h2>
<p class="subtitle">আপনার পছন্দের বিভাগ নির্বাচন করুন</p>
<div id="divisionGrid" class="grid divisions"></div>
</section>
<section id="districtSection" class="hidden">
<h2 id="districtTitle">জেলাসমূহ</h2>
<p class="subtitle">আপনার পছন্দের জেলা নির্বাচন করুন</p>
<div id="districtGrid" class="grid districts"></div>
</section>
<section id="placesSection" class="hidden">
<h2 id="placesTitle">দর্শনীয় স্থান</h2>
<div id="placesBox" class="places-box"></div>
</section>
</main>

<script src="./places-data.js?v=4"></script>
<script>
const divisions=[
{name:"ঢাকা",emoji:"🏛️",districts:["ঢাকা","ফরিদপুর","গাজীপুর","গোপালগঞ্জ","কিশোরগঞ্জ","মাদারীপুর","মানিকগঞ্জ","মুন্সিগঞ্জ","নারায়ণগঞ্জ","নরসিংদী","রাজবাড়ী","শরীয়তপুর","টাঙ্গাইল"]},
{name:"চট্টগ্রাম",emoji:"🏖️",districts:["চট্টগ্রাম","কক্সবাজার","কুমিল্লা","ব্রাহ্মণবাড়িয়া","চাঁদপুর","ফেনী","লক্ষ্মীপুর","নোয়াখালী","খাগড়াছড়ি","রাঙামাটি","বান্দরবান"]},
{name:"রাজশাহী",emoji:"🏰",districts:["রাজশাহী","বগুড়া","জয়পুরহাট","নওগাঁ","নাটোর","চাঁপাইনবাবগঞ্জ","পাবনা","সিরাজগঞ্জ"]},
{name:"খুলনা",emoji:"🌳",districts:["খুলনা","বাগেরহাট","চুয়াডাঙ্গা","যশোর","ঝিনাইদহ","কুষ্টিয়া","মাগুরা","মেহেরপুর","নড়াইল","সাতক্ষীরা"]},
{name:"বরিশাল",emoji:"🚣",districts:["বরিশাল","বরগুনা","ভোলা","ঝালকাঠি","পটুয়াখালী","পিরোজপুর"]},
{name:"সিলেট",emoji:"🌿",districts:["সিলেট","মৌলভীবাজার","হবিগঞ্জ","সুনামগঞ্জ"]},
{name:"রংপুর",emoji:"⛰️",districts:["রংপুর","দিনাজপুর","গাইবান্ধা","কুড়িগ্রাম","লালমনিরহাট","নীলফামারী","পঞ্চগড়","ঠাকুরগাঁও"]},
{name:"ময়মনসিংহ",emoji:"🌄",districts:["ময়মনসিংহ","জামালপুর","নেত্রকোনা","শেরপুর"]}
];

const divisionSection=document.getElementById("divisionSection");
const districtSection=document.getElementById("districtSection");
const placesSection=document.getElementById("placesSection");
const divisionGrid=document.getElementById("divisionGrid");
const districtGrid=document.getElementById("districtGrid");
const backButton=document.getElementById("backButton");
const placesBox=document.getElementById("placesBox");
const params=new URLSearchParams(location.search);
const requestedDivision=params.get("division");
let cameFromHome=Boolean(requestedDivision);

function showDivisions(){
divisionSection.classList.remove("hidden");
districtSection.classList.add("hidden");
placesSection.classList.add("hidden");
backButton.classList.add("hidden");
}

function showDistricts(division){
divisionSection.classList.add("hidden");
districtSection.classList.remove("hidden");
placesSection.classList.add("hidden");
backButton.classList.remove("hidden");
document.getElementById("districtTitle").textContent=division.name+" বিভাগের জেলাসমূহ";
districtGrid.innerHTML="";
division.districts.forEach(function(district){
const button=document.createElement("button");
button.type="button";
button.className="card district-card";
button.textContent=district;
button.addEventListener("click",function(){showPlaces(district,button);});
districtGrid.appendChild(button);
});
window.scrollTo(0,0);
}

function showPlaces(district,button){
document.querySelectorAll(".district-card").forEach(function(card){card.classList.remove("selected");});
button.classList.add("selected");
document.getElementById("placesTitle").textContent=district+" — দর্শনীয় স্থান";
placesSection.classList.remove("hidden");
placesBox.innerHTML="";

if(typeof placesData==="undefined" || !Array.isArray(placesData)){
placesBox.textContent="পর্যটনস্থলের ডেটা লোড হয়নি। places-data.js ফাইলটি পরীক্ষা করুন।";
}else{
const list=placesData.filter(function(place){
return String(place.district).trim()===district.trim();
});
if(list.length===0){
placesBox.textContent="এই জেলার পর্যটনস্থলের তালিকা এখনো যুক্ত করা হয়নি।";
}else{
const heading=document.createElement("h3");
heading.textContent="মোট "+list.length+"টি দর্শনীয় স্থান";
heading.style.color="#116149";
placesBox.appendChild(heading);
list.forEach(function(place){
const item=document.createElement("div");
item.className="place-item";
const name=document.createElement("strong");
name.textContent=place.name;
const points=document.createElement("div");
points.textContent="⭐ পয়েন্ট: "+place.points;
item.appendChild(name);
item.appendChild(points);
placesBox.appendChild(item);
});
}
}
placesSection.scrollIntoView({behavior:"smooth",block:"start"});
}

divisions.forEach(function(division){
const button=document.createElement("button");
button.type="button";
button.className="card division-card";
const photo=document.createElement("div");
photo.className="photo";
photo.textContent=division.emoji;
const name=document.createElement("span");
name.className="division-name";
name.textContent=division.name+" বিভাগ";
button.append(photo,name);
button.addEventListener("click",function(){showDistricts(division);});
divisionGrid.appendChild(button);
});

backButton.addEventListener("click",function(){
if(!placesSection.classList.contains("hidden")){
placesSection.classList.add("hidden");
document.querySelectorAll(".district-card").forEach(function(card){card.classList.remove("selected");});
}else if(cameFromHome){
location.href="./index.html#divisions";
}else{
showDivisions();
}
});

if(requestedDivision){
const selected=divisions.find(function(item){return item.name===requestedDivision;});
if(selected){showDistricts(selected);}else{showDivisions();}
}else{
showDivisions();
}
</script>
</body>
</html>
