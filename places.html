<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>দর্শনীয় স্থান | ঘুরবো বাংলাদেশ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f8f4;color:#20352a;font-family:Arial,sans-serif}
header{background:#104e34;color:white;padding:18px}
header a{color:white;text-decoration:none;margin-right:14px}
main{max-width:1000px;margin:auto;padding:20px 14px}
h1,h2{color:#176b43}
.panel{background:white;padding:18px;border-radius:14px;margin:15px 0;border:1px solid #dce9df}
select,input{width:100%;padding:12px;border:1px solid #cbd9cf;border-radius:8px;margin:8px 0;font-size:16px;background:white}
button,.btn{background:#176b43;color:white;border:0;padding:12px 16px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block;margin:5px 0}
.place{background:white;border:1px solid #dce9df;border-radius:12px;padding:16px;margin:12px 0}
.place h3{margin-top:0}
.muted{color:#66766b;line-height:1.7}
#message{font-weight:bold}
</style>
</head>
<body>
<header>
  <strong>ঘুরবো বাংলাদেশ</strong>
  <p>
    <a href="./index.html">হোম</a>
    <a href="./login.html">লগইন</a>
    <a href="./dashboard.html">আমার ড্যাশবোর্ড</a>
  </p>
</header>

<main>
  <h1>বাংলাদেশ ঘুরে দেখুন</h1>
  <p class="muted">বিভাগ ও জেলা নির্বাচন করে দর্শনীয় স্থান দেখুন। কোনো ছবি ব্যবহার করা হয়নি।</p>

  <section class="panel">
    <label for="division">বিভাগ নির্বাচন করুন</label>
    <select id="division">
      <option value="">বিভাগ বেছে নিন</option>
    </select>

    <label for="district">জেলা নির্বাচন করুন</label>
    <select id="district" disabled>
      <option value="">আগে বিভাগ নির্বাচন করুন</option>
    </select>
  </section>

  <h2 id="listTitle">দর্শনীয় স্থান</h2>
  <div id="placesList" class="muted">প্রথমে বিভাগ ও জেলা নির্বাচন করুন।</div>
  <p id="message"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hbllzgylzemdszsbetkl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhibGx6Z3lsemVtZHN6c2JldGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTA5MjksImV4cCI6MjEwNjgyNjkyOX0.Qsx2bG000YHhzoyObbXZBxE8wPrrtjvonnplqGyyX5w";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const divisions = {
  "ঢাকা":["ঢাকা","ফরিদপুর","গাজীপুর","গোপালগঞ্জ","কিশোরগঞ্জ","মাদারীপুর","মানিকগঞ্জ","মুন্সিগঞ্জ","নারায়ণগঞ্জ","নরসিংদী","রাজবাড়ী","শরীয়তপুর","টাঙ্গাইল"],
  "চট্টগ্রাম":["চট্টগ্রাম","কক্সবাজার","কুমিল্লা","ব্রাহ্মণবাড়িয়া","চাঁদপুর","ফেনী","লক্ষ্মীপুর","নোয়াখালী","খাগড়াছড়ি","রাঙামাটি","বান্দরবান"],
  "রাজশাহী":["রাজশাহী","বগুড়া","জয়পুরহাট","নওগাঁ","নাটোর","চাঁপাইনবাবগঞ্জ","পাবনা","সিরাজগঞ্জ"],
  "খুলনা":["খুলনা","বাগেরহাট","চুয়াডাঙ্গা","যশোর","ঝিনাইদহ","কুষ্টিয়া","মাগুরা","মেহেরপুর","নড়াইল","সাতক্ষীরা"],
  "বরিশাল":["বরিশাল","বরগুনা","ভোলা","ঝালকাঠি","পটুয়াখালী","পিরোজপুর"],
  "সিলেট":["সিলেট","মৌলভীবাজার","হবিগঞ্জ","সুনামগঞ্জ"],
  "রংপুর":["রংপুর","দিনাজপুর","গাইবান্ধা","কুড়িগ্রাম","লালমনিরহাট","নীলফামারী","পঞ্চগড়","ঠাকুরগাঁও"],
  "ময়মনসিংহ":["ময়মনসিংহ","জামালপুর","নেত্রকোনা","শেরপুর"]
};

const places = [
  {division:"চট্টগ্রাম",district:"কক্সবাজার",name:"কক্সবাজার সমুদ্রসৈকত",points:2},
  {division:"চট্টগ্রাম",district:"কক্সবাজার",name:"হিমছড়ি",points:1.5},
  {division:"চট্টগ্রাম",district:"কক্সবাজার",name:"ইনানী সমুদ্রসৈকত",points:1},
  {division:"চট্টগ্রাম",district:"চট্টগ্রাম",name:"পতেঙ্গা সমুদ্রসৈকত",points:1.5},
  {division:"চট্টগ্রাম",district:"চট্টগ্রাম",name:"ফয়েজ লেক",points:1},
  {division:"চট্টগ্রাম",district:"রাঙামাটি",name:"কাপ্তাই হ্রদ",points:2},
  {division:"সিলেট",district:"সিলেট",name:"জাফলং",points:2},
  {division:"সিলেট",district:"সিলেট",name:"রাতারগুল সোয়াম্প ফরেস্ট",points:1.5},
  {division:"সিলেট",district:"সিলেট",name:"সাদাপাথর",points:1},
  {division:"রাজশাহী",district:"রাজশাহী",name:"পদ্মা নদীর পাড়",points:1},
  {division:"ঢাকা",district:"ঢাকা",name:"লালবাগ কেল্লা",points:1.5},
  {division:"ঢাকা",district:"ঢাকা",name:"আহসান মঞ্জিল",points:1}
];

const divisionSelect = document.getElementById("division");
const districtSelect = document.getElementById("district");
const list = document.getElementById("placesList");
const message = document.getElementById("message");

Object.keys(divisions).forEach(name => {
  divisionSelect.add(new Option(name + " বিভাগ", name));
});

divisionSelect.addEventListener("change", () => {
  districtSelect.innerHTML = '<option value="">জেলা বেছে নিন</option>';
  districtSelect.disabled = !divisionSelect.value;
  if (divisionSelect.value) {
    divisions[divisionSelect.value].forEach(name => {
      districtSelect.add(new Option(name, name));
    });
  }
  list.textContent = "এখন একটি জেলা নির্বাচন করুন।";
  document.getElementById("listTitle").textContent = "দর্শনীয় স্থান";
});

districtSelect.addEventListener("change", showPlaces);

async function showPlaces() {
  const division = divisionSelect.value;
  const district = districtSelect.value;
  if (!district) return;

  document.getElementById("listTitle").textContent = district + " জেলার দর্শনীয় স্থান";
  list.replaceChildren();
  message.textContent = "";

  const found = places.filter(p => p.division === division && p.district === district);
  if (!found.length) {
    list.textContent = "এই জেলার স্থানগুলোর তালিকা এখনো যোগ করা হয়নি। পরে নতুন স্থান যোগ করা যাবে।";
    return;
  }

  let visited = new Set();
  const {data: authData} = await sb.auth.getUser();
  const user = authData?.user;

  if (user) {
    const {data, error} = await sb.from("place_visits")
      .select("place_name").eq("user_id", user.id);
    if (!error && data) visited = new Set(data.map(v => v.place_name));
  }

  found.forEach(place => {
    const card = document.createElement("article");
    card.className = "place";
    const title = document.createElement("h3");
    title.textContent = place.name;
    const score = document.createElement("p");
    score.textContent = "পয়েন্ট: " + place.points;
    const btn = document.createElement("button");
    btn.textContent = visited.has(place.name) ? "পয়েন্ট নেওয়া হয়েছে" : "ভ্রমণ সম্পন্ন জমা দিন";
    btn.disabled = visited.has(place.name);
    btn.addEventListener("click", () => recordVisit(place, btn));
    card.append(title, score, btn);
    list.appendChild(card);
  });
}

async function recordVisit(place, btn) {
  message.textContent = "";
  const {data: authData, error: authError} = await sb.auth.getUser();
  const user = authData?.user;

  if (authError || !user) {
    window.location.href = "./login.html";
    return;
  }

  btn.disabled = true;
  btn.textContent = "জমা হচ্ছে...";

  const {error} = await sb.from("place_visits").insert({
    user_id: user.id,
    place_name: place.name,
    points: place.points
  });

  if (error) {
    if (error.code === "23505") {
      btn.textContent = "পয়েন্ট নেওয়া হয়েছে";
      message.textContent = "এই স্থান থেকে আগে পয়েন্ট নেওয়া হয়েছে।";
    } else {
      btn.disabled = false;
      btn.textContent = "ভ্রমণ সম্পন্ন জমা দিন";
      message.textContent = "জমা হয়নি: " + error.message;
    }
    return;
  }

  btn.textContent = "পয়েন্ট যোগ হয়েছে ✓";
  message.textContent = place.points + " পয়েন্ট আপনার হিসাবে যোগ হয়েছে।";
}

const requestedDivision = new URLSearchParams(window.location.search).get("division");
if (requestedDivision && divisions[requestedDivision]) {
  divisionSelect.value = requestedDivision;
  divisionSelect.dispatchEvent(new Event("change"));
}
</script>
</body>
</html>
